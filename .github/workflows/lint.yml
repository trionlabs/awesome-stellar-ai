name: Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  awesome-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test the validator
        run: npm test
      - name: Validate evidence catalog
        run: npm run check:catalog
      - name: Run awesome-lint
        run: npx --yes awesome-lint
